<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="t d">
  <title id="t">Escala do CES, esforço do cliente</title>
  <desc id="d">Escala de 1 a 7 do Customer Effort Score, de muito difícil a muito fácil.</desc>
  <rect width="960" height="300" rx="16" fill="#f6f7f8"/>
  <text x="48" y="56" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="24" font-weight="700" fill="#14161a">Escala do CES — quanto esforço o cliente precisou</text>
  <text x="48" y="86" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" fill="#5b626c">“A empresa facilitou a resolução do seu problema?”</text>

  <g font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#ffffff">
    <rect x="48" y="122" width="118" height="72" rx="10" fill="#e5484d"/><text x="107" y="170">1</text>
    <rect x="176" y="122" width="118" height="72" rx="10" fill="#ea6b4a"/><text x="235" y="170">2</text>
    <rect x="304" y="122" width="118" height="72" rx="10" fill="#f0a05b"/><text x="363" y="170">3</text>
    <rect x="432" y="122" width="118" height="72" rx="10" fill="#c9ced6"/><text x="491" y="170" fill="#33383f">4</text>
    <rect x="560" y="122" width="118" height="72" rx="10" fill="#7ec98f"/><text x="619" y="170">5</text>
    <rect x="688" y="122" width="118" height="72" rx="10" fill="#4fbc68"/><text x="747" y="170">6</text>
    <rect x="816" y="122" width="96" height="72" rx="10" fill="#2fb344"/><text x="864" y="170">7</text>
  </g>

  <g font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="700">
    <text x="48" y="228" fill="#e5484d">Muito difícil</text>
    <text x="432" y="228" fill="#5b626c" text-anchor="middle">Neutro</text>
    <text x="912" y="228" fill="#2fb344" text-anchor="end">Muito fácil</text>
  </g>
  <text x="48" y="266" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" fill="#5b626c">CES alto significa pouco esforço. É a métrica indicada para ouvir quem passou por um problema.</text>
</svg>
