<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="t d">
  <title id="t">Tipos de pergunta para pesquisa de satisfação</title>
  <desc id="d">Cinco formatos de pergunta: nota de 0 a 10, carinhas, estrelas, escolha única e comentário aberto.</desc>
  <rect width="960" height="380" rx="16" fill="#f6f7f8"/>
  <text x="48" y="56" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="24" font-weight="700" fill="#14161a">Formatos de pergunta que funcionam no totem</text>
  <text x="48" y="86" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" fill="#5b626c">Regra do totem: uma pergunta principal e um comentário opcional. O cliente responde em poucos toques.</text>

  <g font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
    <rect x="48" y="112" width="864" height="52" rx="10" fill="#ffffff" stroke="#e4e7ea"/>
    <text x="72" y="144" font-size="15" font-weight="700" fill="#14161a">Nota de 0 a 10</text>
    <text x="300" y="144" font-size="14" fill="#5b626c">mede lealdade (NPS) — a pergunta principal padrão</text>
    <g text-anchor="middle" font-size="13" font-weight="700" fill="#33383f">
      <rect x="712" y="126" width="168" height="24" rx="6" fill="#eef6ff"/>
      <text x="796" y="143">0  1  2  3 …  9  10</text>
    </g>

    <rect x="48" y="176" width="864" height="52" rx="10" fill="#ffffff" stroke="#e4e7ea"/>
    <text x="72" y="208" font-size="15" font-weight="700" fill="#14161a">Carinhas (SMILE)</text>
    <text x="300" y="208" font-size="14" fill="#5b626c">rápida e amigável — boa para público geral</text>
    <text x="796" y="208" font-size="22" text-anchor="middle">🙁 😐 🙂 😀 🤩</text>

    <rect x="48" y="240" width="864" height="52" rx="10" fill="#ffffff" stroke="#e4e7ea"/>
    <text x="72" y="272" font-size="15" font-weight="700" fill="#14161a">Estrelas</text>
    <text x="300" y="272" font-size="14" fill="#5b626c">mede satisfação com um atendimento (CSAT)</text>
    <text x="796" y="272" font-size="20" fill="#f5a524" text-anchor="middle">★ ★ ★ ★ ☆</text>

    <rect x="48" y="304" width="864" height="52" rx="10" fill="#ffffff" stroke="#e4e7ea"/>
    <text x="72" y="336" font-size="15" font-weight="700" fill="#14161a">Comentário aberto</text>
    <text x="300" y="336" font-size="14" fill="#5b626c">opcional — é o que explica a nota e aponta a correção</text>
    <text x="796" y="336" font-size="14" fill="#5b626c" text-anchor="middle">campo de texto livre</text>
  </g>
</svg>
