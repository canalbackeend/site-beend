# ==========================================================================
# beend.tech — nginx para o site estático
#
# Equivale ao .htaccess, adaptado para nginx (o Coolify NÃO lê .htaccess).
#
# IMPORTANTE: não force HTTPS aqui. Se o Cloudflare estiver na frente, ele
# entrega a requisição em HTTP interno e um redirect de HTTPS criaria loop
# (foi exatamente o que aconteceu no backeend.com.br). O HTTPS fica com o
# Cloudflare ou com o Traefik do Coolify.
# ==========================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # ---------- compressão ----------
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/html text/plain text/css text/xml application/xml
               application/javascript application/json image/svg+xml;

    # ---------- cabeçalhos de segurança ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ---------- redirecionamentos de links antigos ----------
    location = /index.html          { return 301 /; }
    location = /index.php           { return 301 /; }
    location = /services-details.html  { return 301 /totem-de-pesquisa-de-satisfacao.html; }
    location = /service-details.html   { return 301 /totem-de-pesquisa-de-satisfacao.html; }
    location = /portfolio-details.html { return 301 /segmentos.html; }

    # ---------- não servir arquivos do gerador ----------
    location ~* \.(mjs|md)$ { deny all; }
    location ~* ^/(content|tools)/ { deny all; }

    # ---------- cache ----------
    # assets com hash no nome podem ser imutáveis; aqui a versão do CSS já
    # vai na URL (styles.css?v=xxxx), então 1 ano é seguro para imagens.
    location ~* \.(webp|jpg|jpeg|png|svg|woff2)$ { expires 1y; access_log off; }
    location ~* \.(css|js)$                      { expires 30d; }
    location ~* \.(xml|txt)$                     { expires 1h; }

    # ---------- páginas ----------
    location / {
        try_files $uri $uri/ =404;
        expires 5m;
    }

    # ---------- 404 ----------
    error_page 404 /404.html;

    # ---------- host canônico (www) ----------
    # Descomente SOMENTE se o Cloudflare for removido (DNS cinza) e o
    # certificado TLS for emitido pelo Coolify/Traefik.
    # if ($host = beend.tech) {
    #     return 301 https://www.beend.tech$request_uri;
    # }

    # ---------- blog ----------
    location /blog/ {
        try_files $uri $uri/index.html =404;
        expires 5m;
    }
}
