# ==========================================================================
# beend.tech — nginx para o site estático
#
# Equivale ao .htaccess, adaptado para nginx (o Coolify NÃO lê .htaccess).
#
# IMPORTANTE 1 — não force HTTPS aqui. Se o Cloudflare estiver na frente, ele
# entrega a requisição em HTTP interno e um redirect de HTTPS criaria loop.
# O HTTPS fica com o Cloudflare ou com o Traefik do Coolify.
#
# IMPORTANTE 2 — a diretiva "index index.html" foi REMOVIDA de propósito.
# Ela fazia um redirecionamento INTERNO para /index.html; com a regra de URL
# amigável, isso entraria em LOOP INFINITO na home. No lugar dela, o bloco
# "location /" resolve tudo com try_files ($uri → $uri/index.html → $uri.html),
# sem redirect interno.
# ==========================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    charset utf-8;

    # Redirecionamentos de volta com caminho RELATIVO.
    # Sem isto o nginx monta a URL absoluta com $scheme (http, porque o TLS
    # termina no Traefik/Coolify) e todo 301 vira http:// → um salto extra.
    absolute_redirect off;

    # ---------- compressão ----------
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/xml
               application/javascript application/json image/svg+xml;

    # ---------- cabeçalhos de segurança ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ---------- redirecionamentos de links antigos ----------
    location = /index.php              { return 301 /; }
    location = /services-details.html  { return 301 /totem-de-pesquisa-de-satisfacao; }
    location = /service-details.html   { return 301 /totem-de-pesquisa-de-satisfacao; }
    location = /portfolio-details.html { return 301 /segmentos; }

    # ---------- URLs amigáveis ----------
    # O arquivo continua sendo "planos-e-precos.html", mas a URL pública é
    # "/planos-e-precos". A regra abaixo manda o .html antigo para a versão
    # limpa com 301 (evita conteúdo duplicado).
    #
    # Exceções obrigatórias:
    #   /index.html  → 301 para "/" (regra exata, tem prioridade sobre o regex)
    #   /404.html    → precisa servir 200 (error_page faz redirect interno)
    #   /google*.html → arquivos de verificação do Google precisam servir 200
    location = /index.html { return 301 /; }

    # /blog/index.html → /blog   (precisa vir ANTES da regra genérica de .html)
    location ~ ^/(?<dir>.+)/index\.html$ { return 301 /$dir; }

    # Índice do blog: é o único diretório com index.html no site.
    # A regra exata serve o arquivo direto (200 em zero saltos) e a barra
    # final converge para a URL canônica. Sem ela o try_files também
    # resolveria pelo $uri/index.html — isto aqui é explicitação, não conserto
    # de laço (testado com nginx real: com ou sem a regra, /blog serve 200).
    location = /blog  { try_files /blog/index.html =404; expires 5m; }
    location = /blog/ { return 301 /blog; }

    location ~ ^/(?!404\.html$|google[a-z0-9]+\.html$)(?<clean>.+)\.html$ {
        return 301 /$clean;
    }

    # ---------- não servir arquivos do gerador ----------
    location ~* \.(mjs|md)$ { deny all; }
    location ~* ^/(content|tools)/ { deny all; }

    # ---------- arquivos ocultos ----------
    # (exceto .well-known, usado por validação de certificado)
    location ~ /\.(?!well-known) { deny all; }

    # ---------- cache ----------
    location ~* \.(webp|jpg|jpeg|png|svg|woff2)$ { expires 1y; access_log off; }
    location ~* \.(css|js)$                      { expires 30d; }
    location ~* \.(xml|txt)$                     { expires 1h; }

    # ---------- páginas ----------
    # /planos-e-precos → planos-e-precos.html
    # /blog            → blog/index.html
    # /                → index.html
    # $uri/index.html vem ANTES de $uri.html para que diretórios resolvam
    # sem redirecionamento interno (que causaria loop com a regra de .html).
    location / {
        try_files $uri $uri/index.html $uri.html =404;
        expires 5m;
    }

    # ---------- 404 ----------
    error_page 404 /404.html;

    # ---------- host canônico (www) ----------
    # Descomente SOMENTE se o Cloudflare for removido (DNS cinza) e o
    # certificado TLS for emitido pelo Coolify/Traefik.
    # if ($host = beend.tech) {
    #     return 301 https://www.beend.tech$request_uri;
    # }
}
